<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0"/>
  <meta http-equiv="Pragma" content="no-cache"/>
  <meta http-equiv="Expires" content="0"/>
  <title>Notes Demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      background: #0f172a;
      color: #e5e7eb;
    }

    header {
      padding: 12px 16px;
      background: #020617;
      border-bottom: 1px solid #1e293b;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    h1 {
      margin: 0;
      font-size: 18px;
      flex: 1;
    }

    #userEmail {
      font-size: 13px;
      color: #38bdf8;
      font-weight: 500;
      background: #0f172a;
      padding: 4px 10px;
      border-radius: 9999px;
      border: 1px solid #1e293b;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 16px;
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 16px;
    }

    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; }
    }

    section {
      background: #020617;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 12px;
    }

    button {
      padding: 8px 10px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      background: #2563eb;
      color: white;
      font-size: 13px;
    }

    button.secondary { background: #475569; }
    button.delete    { background: #dc2626; }

    input, textarea {
      width: 100%;
      padding: 8px;
      margin-bottom: 8px;
      border-radius: 4px;
      border: 1px solid #1e293b;
      background: #020617;
      color: #e5e7eb;
      font-size: 13px;
      box-sizing: border-box;
    }

    textarea { min-height: 180px; }

    .note {
      padding: 10px 8px;
      border-bottom: 1px solid #1e293b;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      cursor: pointer;
    }

    .note:hover  { background: #0f172a; }
    .note.active { background: #1e293b; }

    .note-title {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    button:disabled {
      background: #16a34a;
      cursor: default;
      opacity: 1;
    }

    .status {
      margin-top: 8px;
      font-size: 12px;
      color: #94a3b8;
      white-space: pre-wrap;
    }

    /* ===================== Auth Gate ===================== */

    #authGate {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 60vh;
      gap: 16px;
      text-align: center;
    }

    #authGate p { color: #94a3b8; font-size: 14px; margin: 0; }

    /* ===================== Modal ===================== */

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal {
      width: 100%;
      max-width: 520px;
      background: #020617;
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 14px;
    }

    .modal-header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
    }

    .modal-body   { margin-top: 12px; }

    .modal-footer {
      margin-top: 12px;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    /* ===================== Busy State ===================== */

    .busy-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      backdrop-filter: blur(2px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }

    .busy-overlay.active { display: flex; cursor: wait; }

    .busy-box {
      padding: 16px 18px;
      background: #020617;
      border: 1px solid #1e293b;
      border-radius: 10px;
      font-size: 13px;
      color: #e5e7eb;
    }

    body.busy { cursor: wait; }
    body.busy button, body.busy input, body.busy textarea {
      pointer-events: none;
      opacity: 0.6;
    }
  </style>
</head>

<body>

<header>
  <h1>Notes Demo</h1>
  <span id="userEmail"></span>
  <button id="btnSignIn"  class="secondary" style="display:none">Sign In</button>
  <button id="btnSignOut" class="secondary" style="display:none">Sign Out</button>
</header>

<!-- Shown by default when not authenticated -->
<div id="authGate">
  <p>Sign in to access your notes.</p>
  <button id="btnSignInGate">Sign In with Microsoft</button>
</div>

<!-- Main app — hidden until authenticated -->
<main id="appMain" style="display:none">

  <!-- Notes list -->
  <section>
    <div style="display:flex; gap:8px; margin-bottom:10px;">
      <button id="btnRefresh" class="secondary">Refresh</button>
      <button id="btnNew">New</button>
    </div>
    <div id="notes"></div>
    <div id="listStatus" class="status"></div>
  </section>

  <!-- Editor -->
  <section>
    <input id="title" placeholder="Title (required)" />
    <textarea id="note" placeholder="Note (optional)"></textarea>

    <div style="display:flex; gap:8px;">
      <button id="btnSave">Save</button>
      <button id="btnDelete" class="delete">Delete</button>
    </div>

    <div id="status" class="status"></div>
  </section>

</main>

<!-- ===================== New Note Modal ===================== -->

<div id="newModal" class="modal-backdrop">
  <div class="modal">
    <div class="modal-header">
      <div>New Note</div>
      <div style="flex:1;"></div>
      <button id="btnModalCancel" class="secondary">Cancel</button>
    </div>

    <div class="modal-body">
      <input id="modalTitle" placeholder="Title (required)" />
      <textarea id="modalNote" placeholder="Optional note"></textarea>
      <div id="modalStatus" class="status"></div>
    </div>

    <div class="modal-footer">
      <button id="btnModalCreate">Create</button>
    </div>
  </div>
</div>

<!-- Busy Overlay -->
<div id="busyOverlay" class="busy-overlay">
  <div class="busy-box">Working…</div>
</div>

<script>
  // ===================== Config =====================
  let CFG = null;

  // ===================== PKCE Helpers ===============

  function randomBase64url(byteLen) {
    const arr = new Uint8Array(byteLen);
    crypto.getRandomValues(arr);
    return btoa(String.fromCharCode(...arr))
      .replace(/\+/g, "-").replace(/\//g, "_").replace(/=/g, "");
  }

  async function sha256Base64url(str) {
    const data   = new TextEncoder().encode(str);
    const digest = await crypto.subtle.digest("SHA-256", data);
    return btoa(String.fromCharCode(...new Uint8Array(digest)))
      .replace(/\+/g, "-").replace(/\//g, "_").replace(/=/g, "");
  }

  async function startLogin() {
    if (!CFG) CFG = await fetch("config.json").then(r => r.json());

    const verifier  = randomBase64url(96);
    const challenge = await sha256Base64url(verifier);
    const state     = randomBase64url(16);

    sessionStorage.setItem("pkce_verifier", verifier);
    sessionStorage.setItem("pkce_state",    state);

    const authorityUrl = CFG.tenant || CFG.authority;

    const params = new URLSearchParams({
      client_id:             CFG.clientId,
      response_type:         "code",
      redirect_uri:          CFG.redirectUri,
      response_mode:         "query",
      scope:                 "openid profile email offline_access",
      state:                 state,
      code_challenge:        challenge,
      code_challenge_method: "S256",
    });

    window.location.href = authorityUrl + "/oauth2/v2.0/authorize?" + params.toString();
  }

  async function startLogout() {
    if (!CFG) CFG = await fetch("config.json").then(r => r.json());

    sessionStorage.removeItem("access_token");
    sessionStorage.removeItem("id_token");
    sessionStorage.removeItem("refresh_token");
    sessionStorage.removeItem("user_profile");

    const authorityUrl = CFG.tenant || CFG.authority;
    const postLogout   = CFG.redirectUri ? CFG.redirectUri.replace("callback.html", "index.html") : window.location.origin;
    const params       = new URLSearchParams({ post_logout_redirect_uri: postLogout });
    
    window.location.href = authorityUrl + "/oauth2/v2.0/logout?" + params.toString();
  }

  function getToken() { 
    return sessionStorage.getItem("id_token") || sessionStorage.getItem("access_token"); 
  }

  // Some IdP connections (e.g. Google-federated accounts via Azure AD CIAM)
  // send back a literal "unknown" string for the name claim instead of
  // omitting it. Treat that placeholder as missing and prefer email-based
  // claims over it.
  function pickDisplayName(claims) {
    if (!claims) return "";
    const rawName = (claims.name || "").trim();
    const hasRealName = rawName && rawName.toLowerCase() !== "unknown";
    return (hasRealName && rawName)
      || claims.preferred_username
      || claims.email
      || (claims.emails && claims.emails[0])
      || "";
  }

  // ===================== State ======================
  let notes      = [];
  let selectedId = null;

  // ===================== Elements ===================
  const elNotes       = document.getElementById("notes");
  const elTitle       = document.getElementById("title");
  const elNote        = document.getElementById("note");
  const btnSave       = document.getElementById("btnSave");
  const elStatus      = document.getElementById("status");
  const elListStatus  = document.getElementById("listStatus");
  const modal         = document.getElementById("newModal");
  const modalTitle    = document.getElementById("modalTitle");
  const modalNote     = document.getElementById("modalNote");
  const modalStatus   = document.getElementById("modalStatus");
  const busyOverlay   = document.getElementById("busyOverlay");

  // ===================== Busy State =================
  function setBusy(isBusy) {
    document.body.classList.toggle("busy", isBusy);
    busyOverlay.classList.toggle("active", isBusy);
  }

  // ===================== Helpers ====================
  async function api(path, method = "GET", body) {
    const token   = getToken();
    const headers = { "Content-Type": "application/json" };
    if (token) headers["Authorization"] = "Bearer " + token;

    const res  = await fetch(CFG.apiBaseUrl + path, {
      method,
      headers,
      body: body ? JSON.stringify(body) : undefined,
    });

    const text = await res.text();
    if (!res.ok) throw new Error(text || res.status);
    return text ? JSON.parse(text) : null;
  }

  function setStatus(msg)     { elStatus.textContent     = msg || ""; }
  function setListStatus(msg) { elListStatus.textContent = msg || ""; }

  // ===================== CRUD =======================
  async function loadNotes() {
    setBusy(true);
    setListStatus("Loading notes...");
    try {
      const res = await api("/notes");
      notes = res.items || [];
      renderNotes();
      setListStatus("");
    } catch (e) {
      setListStatus("Failed to load notes: " + e.message);
    } finally {
      setBusy(false);
    }
  }

  async function loadNote(id) {
    setBusy(true);
    setStatus("Loading note...");
    try {
      const n = await api(`/notes/${id}`);
      elTitle.value = n.title || "";
      elNote.value  = n.note  || "";
      selectedId    = id;
      renderNotes();
      markUnsaved();
      setStatus("");
    } catch (e) {
      setStatus("Failed to load note: " + e.message);
    } finally {
      setBusy(false);
    }
  }

  function markSaved() {
    btnSave.textContent = "Saved";
    btnSave.disabled    = true;
  }

  function markUnsaved() {
    btnSave.textContent = "Save";
    btnSave.disabled    = false;
  }

  async function saveNote() {
    const title = elTitle.value.trim();
    const note  = elNote.value || "";

    if (!title) { setStatus("Title is required"); return; }

    setBusy(true);
    try {
      if (selectedId) {
        setStatus("Updating note...");
        await api(`/notes/${selectedId}`, "PUT", { title, note });
        setStatus("Updated note successfully");
      } else {
        setStatus("Creating note...");
        const res  = await api("/notes", "POST", { title, note });
        selectedId = res.id;
        setStatus("Created note successfully");
      }
      markSaved();
      await loadNotes();
    } catch (e) {
      setStatus("Error saving note: " + e.message);
    } finally {
      setBusy(false);
    }
  }

  async function deleteNote(idToDelete) {
    const id = idToDelete || selectedId;
    if (!id) { setStatus("Select a note to delete"); return; }
    if (!confirm("Delete this note?")) return;

    setBusy(true);
    setStatus("Deleting note...");
    try {
      await api(`/notes/${id}`, "DELETE");
      if (selectedId === id) {
        selectedId    = null;
        elTitle.value = "";
        elNote.value  = "";
        markUnsaved();
      }
      await loadNotes();
      setStatus("Deleted note successfully");
    } catch (e) {
      setStatus("Failed to delete note: " + e.message);
    } finally {
      setBusy(false);
    }
  }

  function renderNotes() {
    elNotes.innerHTML = "";
    notes.forEach(n => {
      const d = document.createElement("div");
      d.className = "note" + (n.id === selectedId ? " active" : "");

      const titleSpan = document.createElement("span");
      titleSpan.className = "note-title";
      titleSpan.textContent = n.title || "(untitled)";

      d.appendChild(titleSpan);
      d.addEventListener("click", () => loadNote(n.id));
      elNotes.appendChild(d);
    });

    if (notes.length === 0) {
      const empty       = document.createElement("div");
      empty.className   = "status";
      empty.textContent = "No notes yet. Click New to create one.";
      elNotes.appendChild(empty);
    }
  }

  // ===================== Modal ======================
  function openModal() {
    modalTitle.value        = "";
    modalNote.value         = "";
    modalStatus.textContent = "";
    modal.style.display     = "flex";
    setTimeout(() => modalTitle.focus(), 0);
  }

  function closeModal() { modal.style.display = "none"; }

  async function createFromModal() {
    const title = modalTitle.value.trim();
    const note  = modalNote.value || "";

    if (!title) { modalStatus.textContent = "Title is required"; return; }

    setBusy(true);
    modalStatus.textContent = "Creating...";
    try {
      const res  = await api("/notes", "POST", { title, note });
      selectedId    = res.id;
      elTitle.value = title;
      elNote.value  = note;
      markSaved();
      closeModal();
      await loadNotes();
      setStatus("Created note successfully");
    } catch (e) {
      modalStatus.textContent = "Failed to create note: " + e.message;
    } finally {
      setBusy(false);
    }
  }

  modal.addEventListener("click", e => { if (e.target === modal) closeModal(); });
  document.addEventListener("keydown", e => {
    if (modal.style.display === "flex" && e.key === "Escape") closeModal();
  });

  // ===================== Wiring =====================
  document.getElementById("btnRefresh").addEventListener("click", loadNotes);
  document.getElementById("btnNew").addEventListener("click", openModal);
  document.getElementById("btnSave").addEventListener("click", saveNote);
  document.getElementById("btnDelete").addEventListener("click", () => deleteNote());
  document.getElementById("btnModalCancel").addEventListener("click", closeModal);
  document.getElementById("btnModalCreate").addEventListener("click", createFromModal);
  document.getElementById("btnSignIn").addEventListener("click", () => startLogin());
  document.getElementById("btnSignInGate").addEventListener("click", () => startLogin());
  document.getElementById("btnSignOut").addEventListener("click", startLogout);
  elTitle.addEventListener("input", markUnsaved);
  elNote.addEventListener("input", markUnsaved);

  // ===================== Init =======================
  async function init() {
    try {
      CFG = await fetch("config.json").then(r => r.json());
    } catch (err) {
      console.warn("Could not load config.json:", err);
    }

    const token = getToken();

    if (!token) {
      document.getElementById("authGate").style.display  = "flex";
      document.getElementById("appMain").style.display   = "none";
      document.getElementById("btnSignIn").style.display = "inline-block";
      return;
    }

    // Authenticated state
    document.getElementById("authGate").style.display  = "none";
    document.getElementById("btnSignIn").style.display = "none";
    document.getElementById("btnSignOut").style.display = "inline-block";
    document.getElementById("appMain").style.display    = "grid";

    try {
      let profileName = "";
      const storedProfile = sessionStorage.getItem("user_profile");
      if (storedProfile) {
        const parsed = JSON.parse(storedProfile);
        profileName = pickDisplayName(parsed);
      }

      if (!profileName) {
        const idToken = sessionStorage.getItem("id_token");
        if (idToken) {
          const base64 = idToken.split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
          const payload = JSON.parse(atob(base64));
          profileName = pickDisplayName(payload);
        }
      }

      if (profileName) {
        document.getElementById("userEmail").textContent = "👤 " + profileName;
      } else {
        document.getElementById("userEmail").textContent = "👤 User";
      }
    } catch (_) {
      document.getElementById("userEmail").textContent = "👤 User";
    }

    loadNotes();
  }

  init();
</script>

</body>
</html>
