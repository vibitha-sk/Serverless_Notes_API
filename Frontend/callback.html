<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Authentication Callback</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      background: #0f172a;
      color: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }
    .card {
      background: #020617;
      border: 1px solid #1e293b;
      padding: 24px;
      border-radius: 10px;
      max-width: 400px;
    }
    .status { font-size: 14px; color: #94a3b8; margin-top: 8px; }
  </style>
</head>
<body>

<div class="card">
  <h3>Signing you in...</h3>
  <div id="status" class="status">Processing authorization code...</div>
</div>

<script>
  // Some IdP connections (e.g. Google-federated accounts via Azure AD CIAM)
  // send back a literal "unknown" string for the name claim instead of
  // omitting it. Treat that placeholder as missing and prefer email-based
  // claims over it.
  function pickDisplayName(claims) {
    if (!claims) return "User";
    const rawName = (claims.name || "").trim();
    const hasRealName = rawName && rawName.toLowerCase() !== "unknown";
    return (hasRealName && rawName)
      || claims.preferred_username
      || claims.email
      || (claims.emails && claims.emails[0])
      || "User";
  }

  async function handleCallback() {
    const statusEl = document.getElementById("status");
    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");
    const error = params.get("error");
    const errorDesc = params.get("error_description");

    if (error) {
      statusEl.textContent = `Error: ${error} - ${errorDesc || ""}`;
      return;
    }

    if (!code) {
      statusEl.textContent = "Error: No authorization code found in URL.";
      return;
    }

    try {
      statusEl.textContent = "Loading configuration...";
      const cfg = await fetch("config.json").then(r => r.json());
      const authorityUrl = cfg.tenant || cfg.authority;

      const verifier = sessionStorage.getItem("pkce_verifier");
      if (!verifier) {
        throw new Error("Missing PKCE code verifier in session storage.");
      }

      statusEl.textContent = "Exchanging code for tokens...";
      
      const tokenBody = new URLSearchParams({
        client_id: cfg.clientId,
        grant_type: "authorization_code",
        code: code,
        redirect_uri: cfg.redirectUri,
        code_verifier: verifier,
      });

      const tokenRes = await fetch(`${authorityUrl}/oauth2/v2.0/token`, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: tokenBody.toString(),
      });

      const tokenData = await tokenRes.json();
      if (!tokenRes.ok) {
        throw new Error(tokenData.error_description || JSON.stringify(tokenData));
      }

      if (tokenData.access_token) sessionStorage.setItem("access_token", tokenData.access_token);
      if (tokenData.id_token)     sessionStorage.setItem("id_token", tokenData.id_token);
      if (tokenData.refresh_token) sessionStorage.setItem("refresh_token", tokenData.refresh_token);

      // Extract user claims safely, supporting email/preferred_username for Google/guest accounts
      if (tokenData.id_token) {
        try {
          const base64Url = tokenData.id_token.split('.')[1];
          const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
          const jsonPayload = decodeURIComponent(atob(base64).split('').map(c => {
            return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
          }).join(''));
          
          const claims = JSON.parse(jsonPayload);
          const userName = pickDisplayName(claims);
          
          sessionStorage.setItem("user_profile", JSON.stringify({ name: userName }));
        } catch (parseErr) {
          console.warn("Failed to parse ID token claims:", parseErr);
        }
      }

      sessionStorage.removeItem("pkce_verifier");
      sessionStorage.removeItem("pkce_state");

      statusEl.textContent = "Success! Redirecting...";
      const returnUrl = cfg.redirectUri.replace("callback.html", "index.html");
      window.location.replace(returnUrl);

    } catch (err) {
      console.error(err);
      statusEl.textContent = "Authentication Failed: " + err.message;
    }
  }

  handleCallback();
</script>

</body>
</html>
